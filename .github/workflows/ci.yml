name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-check:
    name: Format, Lint, Test & Build
    # IOKit bindings only compile on macOS, so there is no Linux fallback runner.
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2.85.8
        with:
          tool: just

      # The same version release.yml was generated by, since `just ci` asks dist
      # whether that file is still the one this config produces.
      - name: Install dist
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"

      # The justfile owns what CI means: format, lint, test, core isolation,
      # release workflow and build. Duplicating the steps here would let the two
      # drift apart.
      - name: Format, Lint, Test & Build
        run: just ci
