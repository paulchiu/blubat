[workspace]
resolver = "3"
members = ["blubat-core", "blubat"]

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Paul Chiu"]
repository = "https://github.com/paulchiu/blubat"
homepage = "https://github.com/paulchiu/blubat"
keywords = ["bluetooth", "battery", "macos", "cli", "tui"]
categories = ["command-line-utilities", "os::macos-apis"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
# Format preserving, so writing `[dashboard] hidden` back leaves the comments
# and the key order of a hand written config exactly where they were.
toml_edit = "0.25"
etcetera = "0.11"
libc = "0.2"
mac-notification-sys = "0.6.15"

# The default feature set pulls in the whole Objective-C runtime, which a
# registry read never touches.
objc2-io-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFDictionary",
    "CFString",
    "CFNumber",
    # IOKit delivers its device notifications through a run loop source, and
    # the daemon's BMAP sweep pumps one of its own while it waits on a reply.
    "CFRunLoop",
] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
] }
# The daemon's own RFCOMM read of a Bose headset's BMAP battery level; only
# the daemon binary crate links against this.
objc2-io-bluetooth = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "Bluetooth",
    "IOBluetoothObject",
    "IOBluetoothDevice",
    "IOBluetoothRFCOMMChannel",
] }

# Testing only.
assert_cmd = "2.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
