[workspace]
resolver = "3"
members = ["blubat-core", "blubat"]

[workspace.lints.rust]
unsafe_code = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

# Curated rather than clippy::pedantic/clippy::nursery wholesale: those groups measured
# at 803 warnings here, dominated by cosmetic ones (use_self, doc_markdown,
# must_use_candidate, redundant_pub_crate, missing_const_for_fn) that would bury real
# findings. Priorities are set above the groups' implicit 0 so these hold if a group is
# ever turned on later.
[workspace.lints.clippy]
redundant_clone = { level = "deny", priority = 1 }
needless_collect = { level = "deny", priority = 1 }
map_unwrap_or = { level = "deny", priority = 1 }
manual_ok_or = { level = "deny", priority = 1 }
clone_on_copy = { level = "deny", priority = 1 }
needless_borrow = { level = "deny", priority = 1 }
large_enum_variant = { level = "deny", priority = 1 }
unnecessary_wraps = { level = "deny", priority = 1 }
assigning_clones = { level = "deny", priority = 1 }
semicolon_if_nothing_returned = { level = "deny", priority = 1 }
explicit_iter_loop = { level = "deny", priority = 1 }
needless_continue = { level = "deny", priority = 1 }
ignored_unit_patterns = { level = "deny", priority = 1 }
redundant_closure_for_method_calls = { level = "deny", priority = 1 }
ptr_as_ptr = { level = "deny", priority = 1 }
borrow_as_ptr = { level = "deny", priority = 1 }
format_collect = { level = "deny", priority = 1 }
single_option_map = { level = "deny", priority = 1 }
needless_pass_by_value = { level = "deny", priority = 1 }
missing_errors_doc = { level = "deny", priority = 1 }

[workspace.package]
version = "0.17.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Paul Chiu"]
repository = "https://github.com/paulchiu/blubat"
homepage = "https://github.com/paulchiu/blubat"
keywords = ["bluetooth", "battery", "macos", "cli", "tui"]
categories = ["command-line-utilities", "os::macos-apis"]

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
# Format preserving, so writing `[dashboard] hidden` back leaves the comments
# and the key order of a hand written config exactly where they were.
toml_edit = "0.25"
etcetera = "0.11"
libc = "0.2"
mac-notification-sys = "0.6.15"

# The default feature set pulls in the whole Objective-C runtime, which a
# registry read never touches.
objc2-io-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "libc",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFDictionary",
    "CFString",
    "CFNumber",
    # IOKit delivers its device notifications through a run loop source, and
    # the daemon's BMAP sweep pumps one of its own while it waits on a reply.
    "CFRunLoop",
] }
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSObject",
    "NSString",
    # CoreBluetooth takes the services to filter on as an array and hands the
    # Battery Level characteristic's value back as data.
    "NSArray",
    "NSData",
] }
# The daemon's own read of a BLE peripheral's Battery Service level; only the
# daemon binary crate links against this, for the same TCC reason IOBluetooth
# is kept out of `blubat-core`.
objc2-core-bluetooth = { version = "0.3.2", default-features = false, features = [
    "std",
    "CBAttribute",
    "CBCentralManager",
    "CBCharacteristic",
    "CBManager",
    "CBPeer",
    "CBPeripheral",
    "CBService",
    "CBUUID",
] }
# The daemon's own RFCOMM read of a Bose headset's BMAP battery level; only
# the daemon binary crate links against this.
objc2-io-bluetooth = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2",
    "objc2-foundation",
    "Bluetooth",
    "IOBluetoothObject",
    "IOBluetoothDevice",
    "IOBluetoothRFCOMMChannel",
] }

# Testing only.
assert_cmd = "2.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
