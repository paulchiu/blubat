[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
#
# macOS only, and one artifact per architecture rather than a universal binary:
# the IOKit bindings build nowhere else, and Homebrew picks the archive that
# matches the machine it is installing on.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
# Where to host releases
hosting = "github"
# Push the generated formula to the tap, which needs a token that may write there
publish-jobs = ["homebrew"]
tap = "paulchiu/homebrew-tap"
formula = "blubat"
